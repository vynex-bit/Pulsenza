<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Pulsenza</title>
  <link rel="stylesheet" href="contact.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <a href="index.html" class="logo">Pulsenza</a>
    <nav class="navbar">
      <a href="index.html">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#services">Services</a>
      <a href="index.html#portfolio">Portfolio</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- CONTACT SECTION -->
  <div class="container">

    <!-- Contact Form -->
    <div class="form-box login">
      <form action="https://api.web3forms.com/submit" method="POST">
        
        <!-- Web3Forms Access Key -->
        <input type="hidden" name="access_key" value="2fa0feb8-aeb2-445b-93e8-7871dd46c55f">
        
        <!-- Optional: success page redirect -->
        <input type="hidden" name="redirect" value="https://web3forms.com/success">

        <h1>Contact Us</h1>

        <div class="input-box">
          <input type="text" name="name" placeholder="Username" required>
          <i class="fa-solid fa-user"></i>
        </div>

        <div class="input-box">
          <input type="email" name="email" placeholder="Email" required>
          <i class="fa-solid fa-envelope"></i>
        </div>

        <div class="input-box">
          <input type="tel" name="phone" placeholder="Phone Number" inputmode="tel">
          <i class="fa-solid fa-phone"></i>
        </div>

        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>

    <!-- Toggle Box -->
    <div class="toggle-box">
      <div class="toggle-panel toggle-left"></div>

      <div class="toggle-panel toggle-right">
        <h1>Welcome Back!</h1>
        <p>Got a question? Contact us using the form and we'll respond quickly.</p>
      </div>
    </div>

  </div>

</body>
</html>
